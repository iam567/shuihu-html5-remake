<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水浒传制作进度</title><style>body{font:16px/1.7 system-ui;background:#f3f0e7;color:#233c32;margin:24px auto;max-width:1100px;padding:0 18px}a{color:#245b45}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}section{background:white;padding:20px;border:1px solid #d9ded4;border-radius:12px}b{font-size:30px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #dadfd5;padding:10px;font-size:14px}small{color:#677664}.failed{color:#ad442e}</style><a href="../">← 素材工坊</a><h1>完整制作队列</h1><p>人物 60 组、补齐头像 38 张（已有 2 张）、补齐物品图集 6 张、界面 8 张。最多同时生成 10 张。失败项保留，后续任务继续。</p><p id="time"></p><div class="cards" id="summary"></div><p>物品清单共有 <strong id="itemCount"></strong> 个已恢复名称；另有 3 个非零参数编号名称未确认。生成结果均先标为候选，人物朝向、切格和物品对应关系还需校验。</p><p id="sync"></p><table><thead><tr><th>任务</th><th>类型</th><th>状态</th></tr></thead><tbody id="tasks"></tbody></table><script type="module">const names={character:'人物九帧精灵',portrait:'人物头像','item-icons':'物品图集',interface:'界面底板'},states={'blocked-service':'服务拒绝 · 已记录',queued:'排队中',running:'生成中','generated-awaiting-review':'已生成 · 待校验',failed:'失败已记录','unknown-timeout-no-auto-retry':'超时待核查','unknown-previous-attempt-no-auto-retry':'上次结果待核查'};async function refresh(){try{const p=await fetch('../data/production-progress.json',{cache:'no-store'}).then(r=>r.json());document.querySelector('#time').textContent='最后更新：'+new Date(p.updatedAt*1000).toLocaleString();document.querySelector('#itemCount').textContent=p.items.namedItems;document.querySelector('#summary').innerHTML=Object.entries(p.counts).map(([k,v])=>`<section>${names[k]}<br><b>${v.generated} / ${v.total}</b><br><small>生成中 ${v.running} · 失败/待核查 ${v.failed}</small></section>`).join('');document.querySelector('#tasks').innerHTML=p.jobs.map(j=>`<tr><td>${j.id}</td><td>${names[j.kind]}</td><td>${states[j.state]||j.state}</td></tr>`).join('');const sync=await fetch('../data/delivery-progress.json',{cache:'no-store'}).then(r=>r.ok?r.json():null);if(sync)document.querySelector('#sync').textContent='交付：工坊 '+(sync.workshop||'待同步')+'；CMS '+(sync.cms||'待备份')+'；GitHub '+(sync.github||'待上传');}catch(e){document.querySelector('#time').textContent='暂时无法读取进度，稍后自动重试';}}refresh();setInterval(refresh,15000);</script></html>
