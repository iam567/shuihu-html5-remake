<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地图修复对照</title><style>body{font:16px/1.7 system-ui;background:#efeee4;color:#253d32;margin:24px}a{color:#275942}select{font:inherit;padding:10px;margin:8px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}figure{margin:0;background:white;padding:15px;border-radius:12px}img{width:100%;image-rendering:auto}figcaption{font-weight:600;margin-bottom:8px}</style><a href="../">← 素材工坊</a><h1>地图修复对照</h1><p>修复错误裁切、重复黑条与地图外部残片。原始通行格、入口和隐藏道具数据保持独立。当前为修复候选，招牌文字和细节接缝仍待校验。</p><select id="map" aria-label="地图"></select><select id="style" aria-label="画风"><option value="pixel-hd">高清重制</option><option value="unreal">虚幻引擎质感</option><option value="ghibli">吉卜力手绘</option></select><main><figure><figcaption>原版布局</figcaption><img id="original" alt="原版地图"></figure><figure><figcaption>已退回的旧拼接</figcaption><img id="old" alt="修复前地图"></figure><figure><figcaption>重新校准图块后的修复候选</figcaption><img id="new" alt="修复后地图"></figure></main><script type="module">const c=await fetch('../data/catalog.json',{cache:'no-store'}).then(r=>r.json()),maps=c.items.filter(i=>i.category==='maps'&&!i.generated);const select=document.querySelector('#map');for(const i of maps){const o=document.createElement('option');o.value=i.details.mapId;o.textContent=i.name;select.append(o);}function update(){const id=select.value,s=document.querySelector('#style').value;document.querySelector('#original').src='../'+maps.find(i=>i.details.mapId===id).image;document.querySelector('#old').src=`../generated/maps/${s}/${id}.webp`;document.querySelector('#new').src=`../generated/maps-v2/${s}/${id}.webp?v=${c.items.find(i=>i.id===`map-${id}-${s}`)?.sha256?.slice(0,12)||'registration2'}`;}select.onchange=update;document.querySelector('#style').onchange=update;update();</script></html>
