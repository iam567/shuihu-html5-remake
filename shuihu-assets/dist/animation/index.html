<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物九帧检视</title><style>body{background:#eeeade;color:#233e34;font:16px/1.7 system-ui;margin:24px}a{color:#285e46}select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #a9b8a8}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:20px}article{background:white;padding:18px;border-radius:12px}canvas{width:100%;image-rendering:pixelated}img{max-width:800px;width:100%;image-rendering:pixelated}</style><a href="../">← 素材工坊</a><h1>人物九帧与四方向步行</h1><p>正面、背面、左侧各三帧。右侧通过镜像显示；转职闪光单独实现。这里检查动作，不改变游戏逻辑。</p><label>人物 <select id="characters"></select></label> <button id="play">暂停</button><p id="status"></p><main id="views"></main><details><summary>原始九帧图集</summary><img id="sheet" alt="原始九帧图集"></details><script type="module">import{loadSpriteSurface,drawWalk}from'./sprites.js';const catalogue=await fetch('../data/catalog.json',{cache:'no-store'}).then(r=>r.json());const all=catalogue.items.filter(i=>i.productionBatch==='batch-004'&&i.category==='characters'&&i.generated);let surface,playing=true,step=0,last=0;const select=document.querySelector('select'),status=document.querySelector('#status');for(const i of all){const o=document.createElement('option');o.value=i.id;o.textContent=i.name;select.append(o);}for(const[d,label]of[['front','正面'],['back','背面'],['left','向左'],['right','向右（镜像）']]){const a=document.createElement('article');a.innerHTML=`<h2>${label}</h2><canvas width="240" height="240" data-direction="${d}"></canvas>`;document.querySelector('main').append(a);}async function load(){const i=all.find(i=>i.id===select.value);if(!i)return;status.textContent='加载中';try{surface=await loadSpriteSurface('../'+i.image);document.querySelector('#sheet').src='../'+i.image;status.textContent='九帧已加载 · 动作与脚步仍待逐人校验';}catch{status.textContent='加载失败';}}select.onchange=load;document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'暂停':'播放';};function render(now){if(playing&&now-last>150){step++;last=now;}for(const c of document.querySelectorAll('canvas')){const ctx=c.getContext('2d');ctx.fillStyle='#d4dfca';ctx.fillRect(0,0,240,240);ctx.fillStyle='#405641';ctx.fillRect(0,216,240,1);if(surface)drawWalk(ctx,surface,c.dataset.direction,step,0,0,240);}requestAnimationFrame(render);}await load();requestAnimationFrame(render);</script></html>
