<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>像素逐帧攻击特效</title><style>body{background:#f1eee4;color:#243e35;font:16px/1.7 system-ui;margin:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}article{background:white;padding:18px;border-radius:14px;min-width:0}canvas{width:100%;image-rendering:pixelated;border-radius:10px}button,.png{padding:9px 18px;border-radius:8px;background:#245642;color:white;border:0;cursor:pointer}a{color:#245642}input{width:100%;accent-color:#245642}.sheet{width:100%;image-rendering:pixelated;background:repeating-conic-gradient(#d8ddd5 0% 25%,#edf0e8 0% 50%) 50%/16px 16px}output{margin-left:12px}summary{cursor:pointer;margin:12px 0}.note{max-width:850px}</style><a href="../">← 全部素材</a><h1>像素逐帧攻击特效</h1><p class="note">每招 16 帧，每帧 96×96 像素，透明背景。按从左到右、从上到下组成 4×4 图集；播放时逐格取图，放大保持像素边缘清楚。可暂停、拖动查看每一帧。</p><p class="note">先看这 5 种样例的风格。效果尚未接入实战，命中帧仍待校验；伤害、范围和使用次数沿用原版逻辑。</p><main id="cards"></main><script type="module">import {effects,mountPreview} from './effects.js';for(const e of effects){const a=document.createElement('article');a.id='item-'+e.id;a.innerHTML=`<h2>${e.name}</h2><canvas width="288" height="288" aria-label="${e.name}像素攻击动画"></canvas><div><button>暂停</button><output></output></div><input aria-label="逐帧查看" type="range" min="0" max="15" step="1" value="0"><details><summary>展开 16 帧图集</summary><img class="sheet" alt="${e.name}完整16帧透明图集" src="sheets/item-${e.id}.svg"><button class="png">下载透明 PNG 图集</button></details>`;document.querySelector('#cards').append(a);mountPreview(a,e).catch(()=>{a.querySelector('output').textContent='图片加载失败，请刷新';});}</script></html>
