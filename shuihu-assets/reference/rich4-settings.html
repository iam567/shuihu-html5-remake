<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rich4 · API 重绘设置</title>
<style>:root{color-scheme:dark;font-family:system-ui;background:#101917;color:#e8efea}body{max-width:1300px;margin:32px auto;padding:0 20px}a{color:#c2ea89}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px}h2{font-size:19px}section{background:#1a2823;border:1px solid #35473c;border-radius:16px;padding:22px;margin:20px 0}label{display:inline-block;margin:8px 18px 8px 0}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #52604f;border-radius:8px;background:#101917;color:inherit}button{cursor:pointer;margin:5px}button.primary{background:#bee983;color:#17220e}button:disabled{opacity:.4;cursor:default}input[type=password]{width:320px;max-width:85vw}small,p{color:#aebfb3;line-height:1.6}.stats{font-size:20px;color:#c2ea89}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #34463b}td button{padding:5px}.scroll{max-height:540px;overflow:auto}#notice{position:sticky;top:0;padding:12px;background:#304331;z-index:5;white-space:pre-wrap}#notice:empty{display:none}dialog{width:min(1000px,90vw);max-height:90vh;background:#14201b;color:inherit;border:1px solid #748666;border-radius:14px}dialog::backdrop{background:#000a}.refs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.refs img{width:100%;background:repeating-conic-gradient(#aaa 0% 25%,#ddd 0% 50%) 50%/20px 20px}textarea{width:95%;height:150px;font-size:12px}.close{float:right}.error{color:#ffbb9b}#preview img{max-width:100%;max-height:500px}input[type=checkbox]{width:18px;height:18px}</style>
<header><div><small>RICH4 / 素材工作室</small><h1>API 重绘设置</h1></div><a href="./">← 返回素材总览</a></header><div id="notice" role="status"></div>
<section><h2>OpenAI API</h2><p>使用你自己的 API 账户独立计费。保存设置不会开始生成；选择资源并点击开始后才调用。密钥仅保存在服务器私有目录，页面不会回显。</p><form id="settings"><label>API Key<br><input id="key" type="password" autocomplete="new-password" placeholder="sk-…；留空保留已保存密钥"></label><label>模型<br><select id="model"><option value="gpt-image-2.5-sunburst">GPT Image 2.5 Sunburst</option><option value="gpt-image-2.5-flare">GPT Image 2.5 Flare</option></select></label><label>质量<br><select id="quality"><option>low</option><option>medium</option><option selected>high</option><option>xhigh</option><option>max</option></select></label><label>并发请求<br><select id="concurrency"><option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option></select></label><div><button class="primary">保存设置</button><button type="button" id="clear">移除密钥并暂停</button><small id="keyState"></small></div></form><small>并发上限 5，实际速度受账户限流影响。暂停后不再提交新请求，已经提交的请求仍会完成并可能计费。请求失败不会自动重复调用。</small></section>
<section><h2>生成队列</h2><p id="stats" class="stats">读取进度…</p><div><button id="start" class="primary">生成选中的资源（API 计费）</button><button id="pause">暂停队列</button><button id="resume">继续已排队任务</button></div><p id="queueState"></p><small>每张拼图最多 36 帧；不同动画组分开，末张保留实际帧数。每组生成完会自动裁切、合成透明 GIF / WebP，检查后点击发布。已完成及审核阻塞组不会重复加入。</small></section>
<section><header><h2>资源组</h2><select id="filter"><option value="pending">待完成</option><option value="ready">待检查发布</option><option value="error">异常</option><option value="all">全部</option></select></header><p><button id="selectAll">选择当前列表可生成项</button><button id="selectNone">清空选择</button><span id="selection"></span></p><div class="scroll"><table><thead><tr><th>选择</th><th>编号</th><th>帧数 / 拼图</th><th>进度</th><th>操作</th></tr></thead><tbody id="groups"></tbody></table></div></section>
<dialog id="detail"><button class="close" id="close">关闭</button><h2 id="detailTitle"></h2><p id="detailStatus"></p><div id="preview"></div><div id="refs" class="refs"></div></dialog>
<script>
const $=s=>document.querySelector(s), api=location.origin+'/rich4/image/api/';let state=null,selected=new Set(),initialized=false,visible=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function note(s){$('#notice').textContent=s}
async function post(action,data={}){const r=await fetch(api+action,{method:'POST',headers:{'Content-Type':'application/json','X-Rich4-CSRF':state.csrf},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error);await refresh();return d}
function run(fn){return async e=>{if(e)e.preventDefault();try{await fn(e)}catch(e){note(e.message)}}}
function label(g){if(g.status==='published_hd_trial')return '已发布';if(g.status!=='pending')return '审核阻塞';if(g.review.status==='ready')return '待检查发布';if(g.review.status==='invalid')return '裁切检查异常';const t=g.tasks;return t.length?`${t.filter(t=>t.status==='done').length}/${g.batches} 张完成 · ${t.filter(t=>t.status==='running').length} 生成中 · ${t.filter(t=>t.status==='error').length} 失败`:'未开始'}
function draw(){let f=$('#filter').value;visible=state.groups.filter(g=>f==='all'||f==='pending'&&g.status==='pending'||f==='ready'&&g.review.status==='ready'||f==='error'&&(g.review.status==='invalid'||g.tasks.some(t=>t.status==='error')));$('#groups').innerHTML=visible.map(g=>`<tr><td><input type="checkbox" data-id="${g.id}" ${selected.has(g.id)?'checked':''} ${g.status!=='pending'?'disabled':''}></td><td>${esc(g.archive?g.archive+' #'+g.asset_id:'#'+g.id)}</td><td>${g.frames} 帧 / ${g.batches||'—'} 张</td><td>${esc(label(g))}</td><td><button data-open="${g.id}">查看 / 检查</button></td></tr>`).join('');selection()}
function selection(){const gs=state.groups.filter(g=>selected.has(g.id));$('#selection').textContent=`已选 ${gs.length} 组 · ${gs.reduce((s,g)=>s+g.batches-g.tasks.filter(t=>['done','running','queued'].includes(t.status)).length,0)} 张待提交`}
async function refresh(){let r=await fetch(api+'status',{cache:'no-store'});if(!r.ok)throw Error('读取失败，请确认网站登录状态');state=await r.json();if(!initialized){for(let k of ['model','quality','concurrency'])$('#'+k).value=state.config[k];initialized=true}$('#keyState').textContent=state.config.has_key?'密钥已保存（不回显）':'尚未设置密钥';let pending=state.groups.filter(g=>g.status==='pending');$('#stats').textContent=`待完成 ${pending.length} 组 · ${pending.reduce((s,g)=>s+g.frames,0)} 帧 · ${pending.reduce((s,g)=>s+g.batches,0)} 张拼图`;$('#queueState').textContent=`队列${state.paused?'已暂停':'运行中'} · 正在请求 ${state.running} / ${state.config.concurrency} · 等待 ${state.groups.reduce((s,g)=>s+g.tasks.filter(t=>t.status==='queued').length,0)} 张`;for(let id of selected)if(!pending.some(g=>g.id===id))selected.delete(id);draw()}
$('#settings').onsubmit=run(async()=>{await post('settings',{api_key:$('#key').value,model:$('#model').value,quality:$('#quality').value,concurrency:Number($('#concurrency').value)});$('#key').value='';note('设置已保存。选择资源后可开始生成。')});$('#clear').onclick=run(async()=>{await post('clear-key');note('密钥已移除，队列已暂停。已提交请求仍会完成。')});$('#pause').onclick=run(()=>post('pause'));$('#resume').onclick=run(()=>post('resume'));$('#start').onclick=run(async()=>{if(!selected.size)throw Error('请先选择要生成的资源组');await post('enqueue',{ids:[...selected]});note('已加入队列。每次最多同时生成 5 张，完成后可预览和发布。')});$('#filter').onchange=draw;$('#selectAll').onclick=()=>{visible.filter(g=>g.status==='pending').forEach(g=>selected.add(g.id));draw()};$('#selectNone').onclick=()=>{selected.clear();draw()};$('#groups').onchange=e=>{if(e.target.dataset.id){let id=Number(e.target.dataset.id);e.target.checked?selected.add(id):selected.delete(id);selection()}};$('#groups').onclick=run(async e=>{if(e.target.dataset.open)await openGroup(Number(e.target.dataset.open))});$('#close').onclick=()=>$('#detail').close();
async function openGroup(id){let g=state.groups.find(g=>g.id===id),r=await fetch(api+'group/'+id),d=await r.json();if(!r.ok)throw Error(d.error);$('#detailTitle').textContent=` ${g.archive?g.archive+' #'+g.asset_id:'#'+id} · ${g.frames} 帧 · ${g.batches} 张拼图`;$('#detailStatus').textContent=label(g)+'。'+(g.review.message||'');$('#preview').innerHTML=`<p><a target="_blank" href="${g.original_sheet||'Data/'+g.directory+'/'+(g.directory.endsWith('-FLC')?'preview.webp':g.frames===1?'frame-000.png':'sheet.jpg')}">打开原版帧表</a></p>`;if(['ready','published'].includes(g.review.status)){$('#preview').innerHTML+=`<img src="${api}file/${id}/hd-preview.webp"><p><a target="_blank" href="${api}file/${id}/hd-sheet.jpg">查看全部裁切帧</a></p>`;if(g.review.status==='ready'){let b=document.createElement('button');b.textContent='已检查动作、方向和裁切，发布 GIF';b.className='primary';b.onclick=run(async()=>{await post('publish',{id});await openGroup(id);note(`#${id} 已备份并发布`)});$('#preview').append(b)}}$('#refs').innerHTML=d.jobs.map(j=>{let t=g.tasks.find(t=>t.batch===j.batch);return `<div><h3>拼图 ${j.batch+1} · ${j.count} 帧</h3><img loading="lazy" src="${api}file/${id}/reference-${j.batch}.png"><p class="error">${esc(t?.error||'')}</p><textarea id="prompt-${j.batch}" ${t?'disabled':''}>${esc(j.prompt)}</textarea><button data-save="${j.batch}" ${t?'disabled':''}>保存此批提示词</button>${t?.status==='done'?`<button data-retry="${j.batch}">重新生成此批（再次计费）</button>`:''}</div>`}).join('');$('#refs').onclick=run(async e=>{if(e.target.dataset.save!==undefined){let b=Number(e.target.dataset.save);await post('prompt',{id,batch:b,prompt:$('#prompt-'+b).value});note('提示词已保存')}if(e.target.dataset.retry!==undefined){await post('retry',{id,batch:Number(e.target.dataset.retry)});await openGroup(id);note('已重新排队，将再次调用 API')}});if(!$('#detail').open)$('#detail').showModal()}
run(refresh)();setInterval(()=>refresh().catch(e=>note(e.message)),5000);
</script></html>
