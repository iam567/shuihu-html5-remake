<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#172a27"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/portraits/1605b8.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="fonts-wenkai.css"><link rel="stylesheet" href="theme.css"><title>水浒传 · 指间江湖</title></head><body>
<main id="app"><header class="topbar"><button id="homeButton" class="brand" aria-label="打开游戏菜单"><span class="seal">水浒</span><span>指间江湖<small>触摸重构版 · 研发中</small></span></button><div class="topright"><span id="place">晁家庄</span><button id="audioToggle" class="round" aria-label="开启或关闭声音">♪</button></div></header>
<section id="world"><canvas id="game" aria-label="游戏地图，点击地面移动，点击人物交谈"></canvas><div id="hint" role="status">正在载入江湖…</div><div id="battleHud" hidden></div><div id="joystickControls" hidden><div id="joystickPad" role="group" aria-label="方向摇杆"><span id="joystickKnob"></span></div><button id="interactButton">交谈 / 调查</button></div><div id="dpadControls" hidden><div class="dpad" role="group" aria-label="方向按键"><button id="dpadUp" aria-label="上"></button><button id="dpadLeft" aria-label="左"></button><button id="dpadRight" aria-label="右"></button><button id="dpadDown" aria-label="下"></button></div><div class="dpad-act"><button id="dpadBack" aria-label="取消">取消</button><button id="dpadOk" aria-label="确认">确认</button></div></div><div id="dialogue" hidden role="button" tabindex="0" aria-label="点击屏幕继续对话"><img id="dialoguePortrait" alt=""><div id="dialogueText"></div></div></section>
<nav id="toolbar"><button data-panel="party" aria-label="人物"><img src="assets/ui/buttons/bar-party.webp" alt=""></button><button data-panel="bag" aria-label="行囊"><img src="assets/ui/buttons/bar-bag.webp" alt=""></button><button data-panel="save" aria-label="存档"><img src="assets/ui/buttons/bar-save.webp" alt=""></button><button data-panel="menu" aria-label="菜单"><img src="assets/ui/buttons/bar-menu.webp" alt=""></button></nav><button id="dockHandle" type="button" aria-label="展开工具栏" aria-expanded="false"><i></i></button>
<section id="titleScreen" class="title-screen"><div class="title-art"></div><div id="buildTag" class="build-tag"></div><div class="title-content"><p class="eyebrow">一百单八将 · 一段新江湖</p><h1>水浒传</h1><p class="subtitle">点触前行，重访梁山。</p><button id="continueGame" class="primary large art-title" hidden aria-label="继续旅程"><img src="assets/ui/buttons/title-continue-on.webp" alt=""></button><button id="newGame" disabled class="large art-title" aria-label="开始新的旅程"><img src="assets/ui/buttons/title-new.webp" alt=""></button><button id="titleHelp" disabled class="text-button art-title" aria-label="游戏设置"><img src="assets/ui/buttons/title-settings.webp" alt=""></button><p class="title-note">HTML5 独立重构 · 点地移动 · 点人交谈</p><div id="loadError" role="alert"></div></div></section>
<div id="modalHost" hidden><div class="scrim"></div><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-top"><button id="modalBack" aria-label="返回上一步">‹ 返回</button><h2 id="modalTitle"></h2><button id="modalClose" aria-label="关闭界面">✕</button></div><div id="modalBody"></div><footer id="modalFooter"></footer></section></div><div id="toast" role="status"></div>
</main><script type="module" src="js/app.js"></script></body></html>
